<!DOCTYPE html>
<html>
	<head>
		<title>Navees | Urdu Word Processor</title>
		<link rel="stylesheet" href="/styles.css">
	</head>
	<body>

		<nav>
			<div id="tools">
				<button id="doc_new">نیا دستاویز</button>
				<button id="doc_open">دستاویز کھولیں</button>
			</div>
		</nav>

		<iframe id="paper" src="/paper.html">
		</iframe>

		<div id="loader" class="active">
			<h1>نَویس</h1>
			<p>اردو لفظ نگار برنامہ</p>
			<small>کمپیوٹر پر اردو لکھائی کا ایک مکمل حل، ہر قسم کا لفظ نگاری کا آلہ اس برنامہ میں موجود ہے۔</small>
			<small class="grey">شمارہِ تعمیر: ۰.۱ ابتدائی</small>
		</div>

		<div class="modal" data-for="doc_new">
			<h2>نیا دستاویز</h2>
			<p>کاغذ:
				<select id="doc_new_page">
					<option value="210x297">A4 (سیدھے رخ)</option>
					<option value="297x210">A4 (لمبے رخ)</option>
				</select>
			</p>
			<p>
				حجم:<br>
				<input type="text" id="doc_new_page_width" value="210 mm" class="ltr" readonly>
				<span class="symbol">ض</span>
				<input type="text" id="doc_new_page_height" value="297 mm" class="ltr" readonly>
			</p>
			<button id="doc_new_confirm">تصدیق</button>
			<button id="doc_new_cancel">منسوخ</button>
		</div>

		<script src="/ui.js"></script>
		<script src="/app.js"></script>
	</body>
</html>
